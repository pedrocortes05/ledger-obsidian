name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install modules
        run: yarn install --frozen-lockfile

      - name: Type check and build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test
